[package]
name = "cps-codex-candy-eval"
version = "0.1.4"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "8c8618aa0f841638262262e3338c115bc075f125", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = "symbols"
lto = "thin"
