[package]
name = "cps-codex-candy-eval"
version = "0.1.2"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "78bc57c5cf24b01a38e985cdd739bb4ae89ce11f", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }

[profile.release]
strip = "symbols"
lto = "thin"
