[package]
name = "cps-codex-candy-eval"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "6a5300a7b5c649f2a6d548df70ccdd58d15e0025", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = "symbols"
lto = "thin"
